name: CI
on:
  push:
    branches: [main, devops-setup]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: StudentManagmentSystem
          MYSQL_USER: SMSUser
          MYSQL_PASSWORD: smspass123
          MYSQL_ROOT_PASSWORD: rootpass123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpass123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/StudentManagmentSystem?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: SMSUser
      SPRING_DATASOURCE_PASSWORD: smspass123

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B verify

      - name: Build Docker image
        run: docker build -t student-management .
