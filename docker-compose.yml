services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: StudentManagmentSystem
      MYSQL_USER: SMSUser
      MYSQL_PASSWORD: smspass123
      MYSQL_ROOT_PASSWORD: rootpass123
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass123"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "7070:7070"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/StudentManagmentSystem?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: SMSUser
      SPRING_DATASOURCE_PASSWORD: smspass123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
