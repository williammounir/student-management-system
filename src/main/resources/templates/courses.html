<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head}" >
    <title>Courses</title>
</head>

<body>
<div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <!-- Page Content -->
    <div id="page-content-wrapper">
        <div th:replace="~{fragments/layout :: navbar}"></div>

        <div class="container-fluid px-4 py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Courses</h2>
                <a th:href="@{/courses/new}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i> Add New
                    Course</a>
            </div>

            <div th:if="${message}" class="alert alert-success text-center" role="alert" th:text="${message}"></div>

            <div class="card mb-4">
                <div class="card-header bg-white">
                    <i class="bi bi-table me-1"></i> Course List
                </div>
                <div class="card-body">
                    <!--here we are checking if There is courses or not-->
                    <div class="text-muted" th:if="${courses.content.isEmpty()}">No Courses Found</div>
                    <!--If there is no courses don't make the list of courses part-->
                    <div class="table-responsive" th:if="${!courses.content.isEmpty()}">
                        <table class="table table-hover table-striped">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Course Name</th>
                                <th>Course Code</th>
                                <th>Course Fees</th>
                                <th>Duration</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="course : ${courses.content}">
                                <td data-label="ID" th:text="${course.id}"></td>
                                <td data-label="Course Name" th:text="${course.courseName}"></td>
                                <td data-label="Couse Code" th:text="${course.courseCode}"></td>
                                <td data-label="Couse Fees" th:text="${course.fee}"></td>
                                <td data-label="Duration" th:text="${course.duration}"></td>

                                <td data-label="Actions">
                                    <!--
                                            Thymeleaf URL note:
                                            @{/courses/${course.id}} treats ${course.id} as literal text inside the URL,
                                            resulting in /courses/$%7Bcourse.id%7D.

                                            Use concatenation instead:
                                            @{'/courses/' + ${course.id}}
                                            This evaluates course.id correctly and produces /courses/{id}.
                                            -->
                                    <a th:href="@{'/courses/' + ${course.id}}" class="btn btn-sm btn-info text-white me-1"
                                       title="View"><i class="bi bi-eye"></i></a>
                                    <!--html can only support get methods-->
                                    <!--this how to use other methods -> <form th:action="@{/courses/{id}/edit(id=${course.id})}" method="post" style="display:inline;">
                                        <input type="hidden" name="_method" value="put" />
                                        <button type="submit" class="link-button">Edit</button>
                                        </form>-->
                                    <!--I am an idiot we shouldn't use put method in here this just sends you to the page no changes have been made to the course yet, when you enter the edit-course then there will be a form that will send in the data in a put method.-->
                                    <a th:href="@{/courses/{id}/edit(id=${course.id})}" class="btn btn-sm btn-warning text-white me-1"
                                       title="Edit"><i class="bi bi-pencil"></i></a>
                                </td>
                            </tr>

                            </tbody>
                        </table>
                    </div>
                    <!--th:if="${courses.totalPages > 1}" -> means if there is no more than 1 page don't make the navigation of pages bar-->
                    <nav th:if="${courses.totalPages > 1}" aria-label="Course pagination">
                        <ul class="pagination justify-content-end">

                            <!-- Previous -->
                            <!--th:classappend="${courses.first} ? 'disabled'" ->if it is the first page then add the disable class to disable this link-->
                            <li class="page-item" th:classappend="${courses.first} ? 'disabled'">
                                <!--that is the way we add parameters to a link, courses.number is the current page number, courses.size the current courses size.-->
                                <!--if courses.number > 0 then page number is courses.number else it is equal 0-->
                                <!--page size means the maximum number of content so if there is content less than of the specified page size no problem will happen-->
                                <a class="page-link" th:href="@{/courses/list(page=${courses.number > 0 ? courses.number-1 : 0},size=${courses.size})}">Previous</a>
                            </li>

                            <!-- Page numbers -->
                            <!-- th:each="pageNum : ${#numbers.sequence(0, courses.totalPages-1)}" making a sequence-->
                            <!--th:classappend="${pageNum} == ${courses.number} ? 'active' : ''" -> making the current page number on navigation bar glow.-->
                            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, courses.totalPages-1)}"

                                th:classappend="${pageNum} == ${courses.number} ? 'active' : ''">
                                <a class="page-link" th:href="@{/courses/list(page=${pageNum}, size=${courses.size})}" th:text="${pageNum + 1}">1</a>
                            </li>


                            <!-- Next -->
                            <li class="page-item" th:classappend="${courses.last} ? 'disabled'">
                                <a class="page-link" th:href="@{/students/list(page=${students.last ? students.number : students.number+1},size=${students.size})}" >Next</a>
                            </li>

                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>

</html>
